  rnd:
    title: "بودجه تحقیق و توسعه کُداک"
    sub: "میلیون دلار در سال. منبع: فایل‌های ۱۰-K و گزارش سالانه ۲۰۰۵ کُداک."
    note: "در سال ۲۰۰۵ که کُداک بیشترین دوربین دیجیتال را در آمریکا فروخت، بیشترین پول را هم خرج تحقیق و توسعه کرد. شش سال بعد این عدد کمتر از یک‌سوم شده بود."
