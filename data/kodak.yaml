    note: "کُداک در آن سال ۷٫۰۵ میلیون دوربین دیجیتال به خرده‌فروشان آمریکا فرستاد، ۴۳ درصد بیشتر از سال قبل، و فاصله‌اش را با نفر دوم زیاد کرد."
