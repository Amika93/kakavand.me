  revenue:
    title: "درآمد سالانه کُداک، از اوج تا ورشکستگی"
    sub: "میلیارد دلار در سال. منبع: گزارش‌های سالانه و فایل‌های ۱۰-K شرکت."
    note: "ارقام همان چیزی‌ست که کُداک در هر سال گزارش کرده و در برخی سال‌ها به‌خاطر جدا شدن بخش‌ها بازنویسی شده، پس شکل نمودار مهم‌تر از رقم دقیق هر سال است."
